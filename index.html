<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14121C">
<meta name="color-scheme" content="dark">
<title>Bet Game으로 이사했어요</title>
<style>
 :root{--bg:#14121C;--fg:#F3EFFA;--dim:#A39CB5;--acc:#FFD23F}
 html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);
  font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;-webkit-text-size-adjust:100%}
 main{min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px 16px calc(24px + env(safe-area-inset-bottom));text-align:center;max-width:440px;margin:0 auto}
 .logo{font-size:34px;font-weight:900}
 p{margin:0;color:var(--dim);line-height:1.55}
 b{color:var(--fg)}
 a.btn{margin-top:6px;display:inline-block;padding:14px 26px;border-radius:14px;background:var(--acc);color:#14121C;
  font-weight:800;text-decoration:none;font-size:18px}
 .box{margin-top:6px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);text-align:left}
 .box p+p{margin-top:8px}
 [hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <div class="logo">🎲 Bet Game</div>
 <p><b>내기 hwan</b>이 <b>Bet Game</b>으로 이름을 바꾸고 새 주소로 옮겼어요.</p>
 <a class="btn" id="go" href="https://harley-hwan.github.io/bet-game/">계속하기</a>
 <div class="box" id="howto" hidden>
  <p>새 아이콘으로 바꾸려면 Safari(안드로이드는 Chrome)에서 <b>harley-hwan.github.io/bet-game</b>을 열고 홈 화면에 다시 추가해 주세요.</p>
  <p>아이폰은 새로 추가한 아이콘에 참가자 명단을 다시 넣어야 해요. 그때까지 이 아이콘은 지우지 말고 <b>계속하기</b>로 쓰면 돼요.</p>
 </div>
</main>
<script>
// 옛 주소(/naegi-hwan/...)를 새 주소(/bet-game/...)로. 하위 경로·주소 인자도 그대로 옮긴다.
//  - 브라우저 탭: 바로 넘긴다 (같은 사이트라 저장된 명단·설정이 그대로 보인다).
//  - 홈 화면에 추가해 둔 앱: 넘기지 않고 안내를 보여 준다. 새 아이콘을 다시 추가하라는 말을 읽을 수 있게.
//    아이폰 홈 화면 앱은 저장 공간이 따로라, 이 아이콘에서 계속하기로 들어가야 예전 명단이 보인다.
(function () {
  var NEW = 'https://harley-hwan.github.io/bet-game/';
  var rest = location.pathname.replace(/^\/naegi-hwan\/?/, '');
  if (rest === 'index.html' || rest === '404.html') rest = '';
  var to = NEW + rest + location.search + location.hash;
  document.getElementById('go').href = to;
  var standalone = false;
  try { standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; } catch (e) {}
  if (standalone) {
    document.getElementById('howto').hidden = false;
    // 이 워커가 안내 화면을 기억해 두면 인터넷이 없을 때도 이 아이콘이 오류 대신 안내를 띄운다.
    try { if (navigator.serviceWorker) navigator.serviceWorker.register('/naegi-hwan/sw.js', { scope: '/naegi-hwan/' }).catch(function () {}); } catch (e) {}
  } else {
    location.replace(to);
  }
})();
</script>
</body>
</html>
